<a class="skip-link" href="#main">Skip to content</a>

<aside class="sidebar" aria-label="Primary">
  <div class="brand">
    <span class="logo" aria-hidden="true">J</span>
    <span class="name">Job Search</span>
  </div>

  <button type="button" class="search-trigger" (click)="palette.open()">
    <app-icon name="search" [size]="14" />
    <span>Search or jump to…</span>
    <span class="keys">
      @for (key of paletteKeys; track $index) {
        <kbd>{{ key }}</kbd>
      }
    </span>
  </button>

  <nav class="nav">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
      >
        <app-icon [name]="item.icon" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="footer-button" (click)="help.open()">
      <app-icon name="keyboard" />
      <span>Shortcuts</span>
      <kbd>?</kbd>
    </button>
    <button type="button" class="footer-button" (click)="auth.logout()">
      <app-icon name="logout" />
      <span>Sign out</span>
    </button>
  </div>
</aside>

<header class="mobile-bar">
  <div class="brand">
    <span class="logo" aria-hidden="true">J</span>
    <span class="name">Job Search</span>
  </div>
  <button type="button" class="btn btn-ghost btn-icon" (click)="palette.open()" aria-label="Search">
    <app-icon name="search" />
  </button>
</header>

<main id="main" class="main" tabindex="-1">
  <router-outlet />
</main>

<nav class="tabbar" aria-label="Primary">
  @for (item of nav; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <app-icon [name]="item.icon" [size]="20" />
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
